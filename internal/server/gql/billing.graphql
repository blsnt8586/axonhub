input CreateManualRechargeOrderInput {
  projectId: ID!
  amount: DecimalInput!
  currency: String
  metadata: JSONRawMessageInput
}

input ConfirmManualPaymentInput {
  orderNo: String!
  eventKey: String
  externalTradeNo: String
  payload: JSONRawMessageInput
  paidAt: Time
}

input CreateSimulatedEPayRechargeCheckoutInput {
  projectId: ID!
  amount: DecimalInput!
  currency: String
  subject: String
  publicBaseUrl: String
  metadata: JSONRawMessageInput
}

input UpsertEPayPaymentProviderInput {
  name: String!
  status: PaymentProviderInstanceStatus
  currency: String
  gatewayUrl: String!
  pid: String!
  key: String
  notifyUrl: String!
  returnUrl: String!
  type: String
  siteName: String
}

input CreateProjectEPayRechargeCheckoutInput {
  projectId: ID!
  amount: DecimalInput!
  currency: String
  subject: String
  providerInstanceId: ID
  metadata: JSONRawMessageInput
}

type PaymentCheckout {
  providerType: String!
  orderNo: String!
  method: String!
  url: String
  params: JSONRawMessage
  amount: Decimal!
  currency: String!
}

extend type Mutation {
  createManualRechargeOrder(input: CreateManualRechargeOrderInput!): PaymentOrder!
  confirmManualPayment(input: ConfirmManualPaymentInput!): PaymentOrder!
  createSimulatedEPayRechargeCheckout(input: CreateSimulatedEPayRechargeCheckoutInput!): PaymentCheckout!
  upsertEPayPaymentProvider(input: UpsertEPayPaymentProviderInput!): PaymentProviderInstance!
  createProjectEPayRechargeCheckout(input: CreateProjectEPayRechargeCheckoutInput!): PaymentCheckout!
}

extend type Query {
  projectBillingAccount(projectId: ID!): BillingAccount!
}
