input CreateManualRechargeOrderInput {
  projectId: ID!
  amount: DecimalInput!
  currency: String
  metadata: JSONRawMessageInput
}

input ConfirmManualPaymentInput {
  orderNo: String!
  eventKey: String
  externalTradeNo: String
  payload: JSONRawMessageInput
  paidAt: Time
}

input CancelPaymentOrderInput {
  orderNo: String!
  reason: String!
}

input MakeUpPaymentOrderInput {
  orderNo: String!
  reason: String!
  paidAt: Time
}

input CreateSimulatedEPayRechargeCheckoutInput {
  projectId: ID!
  amount: DecimalInput!
  currency: String
  subject: String
  publicBaseUrl: String
  metadata: JSONRawMessageInput
}

input UpsertEPayPaymentProviderInput {
  name: String!
  status: PaymentProviderInstanceStatus
  currency: String
  gatewayUrl: String!
  pid: String!
  key: String
  notifyUrl: String!
  returnUrl: String!
  type: String
  siteName: String
}

input CreateMyEPayRechargeCheckoutInput {
  amount: DecimalInput!
  currency: String
  subject: String
  projectId: ID
  providerInstanceId: ID
  metadata: JSONRawMessageInput
}

input AdjustUserBalanceInput {
  userId: ID!
  direction: LedgerTransactionDirection!
  amount: DecimalInput!
  currency: String
  idempotencyKey: String
  memo: String
}

input UpdateUserBillingAccountInput {
  userId: ID!
  status: BillingAccountStatus
  creditLimit: DecimalInput
}

input SaveBillingPriceRuleForm {
  id: ID
  scopeType: BillingPriceRuleScopeType!
  scopeId: Int!
  modelPattern: String!
  price: ModelPriceInput!
  currency: String
  priority: Int
  enabled: Boolean
  referenceId: String
}

input AdminLedgerTransactionsFilter {
  userId: Int
  billingAccountId: Int
  direction: LedgerTransactionDirection
  status: LedgerTransactionStatus
  type: LedgerTransactionType
  referenceType: String
  from: Time
  to: Time
}

input AdminUsageBillingRecordsFilter {
  userId: Int
  projectId: Int
  apiKeyId: Int
  billingAccountId: Int
  modelId: String
  status: UsageBillingRecordStatus
  from: Time
  to: Time
}

input AdminBillingHoldsFilter {
  userId: Int
  projectId: Int
  apiKeyId: Int
  billingAccountId: Int
  modelId: String
  status: BillingHoldStatus
  from: Time
  to: Time
  expiresBefore: Time
}

input AdminPaymentOrdersFilter {
  userId: Int
  projectId: Int
  billingAccountId: Int
  providerType: PaymentOrderProviderType
  status: PaymentOrderStatus
  orderNo: String
  externalTradeNo: String
  from: Time
  to: Time
}

input AdminPaymentEventsFilter {
  paymentOrderId: Int
  providerInstanceId: Int
  providerType: PaymentEventProviderType
  status: PaymentEventStatus
  eventType: String
  eventKey: String
  from: Time
  to: Time
}

input AdminBillingReportFilter {
  from: Time
  to: Time
  currency: String
  limit: Int
}

input ExportAdminBillingCSVInput {
  dataset: String!
  from: Time
  to: Time
  currency: String
  limit: Int
}

type BillingReportSummary {
  rechargeAmountMicros: Int!
  consumptionAmountMicros: Int!
  netMovementMicros: Int!
  refundAmountMicros: Int!
  failedPaymentCount: Int!
  failedPaymentEventCount: Int!
  pendingHoldAmountMicros: Int!
  pendingHoldCount: Int!
}

type BillingDailyReportRow {
  date: String!
  rechargeAmountMicros: Int!
  consumptionAmountMicros: Int!
  netMovementMicros: Int!
  failedPaymentCount: Int!
  failedPaymentEventCount: Int!
}

type BillingTopModelRow {
  modelId: String!
  chargeAmountMicros: Int!
  requestCount: Int!
}

type BillingTopProjectRow {
  projectId: Int!
  projectName: String!
  chargeAmountMicros: Int!
  requestCount: Int!
}

type BillingTopUserReportRow {
  userId: Int!
  email: String!
  rechargeAmountMicros: Int!
  consumptionAmountMicros: Int!
  netAmountMicros: Int!
}

type BillingCommercialReport {
  from: Time
  to: Time
  currency: String!
  summary: BillingReportSummary!
  daily: [BillingDailyReportRow!]!
  topModels: [BillingTopModelRow!]!
  topProjects: [BillingTopProjectRow!]!
  topUsers: [BillingTopUserReportRow!]!
}

type BillingCSVExportPayload {
  fileName: String!
  content: String!
  contentType: String!
}

type PaymentCheckout {
  providerType: String!
  orderNo: String!
  method: String!
  url: String
  params: JSONRawMessage
  amount: Decimal!
  currency: String!
}

extend type Mutation {
  createManualRechargeOrder(input: CreateManualRechargeOrderInput!): PaymentOrder!
  confirmManualPayment(input: ConfirmManualPaymentInput!): PaymentOrder!
  cancelPaymentOrder(input: CancelPaymentOrderInput!): PaymentOrder!
  makeUpPaymentOrder(input: MakeUpPaymentOrderInput!): PaymentOrder!
  createSimulatedEPayRechargeCheckout(input: CreateSimulatedEPayRechargeCheckoutInput!): PaymentCheckout!
  upsertEPayPaymentProvider(input: UpsertEPayPaymentProviderInput!): PaymentProviderInstance!
  createMyEPayRechargeCheckout(input: CreateMyEPayRechargeCheckoutInput!): PaymentCheckout!
  adjustUserBalance(input: AdjustUserBalanceInput!): LedgerTransaction!
  updateUserBillingAccount(input: UpdateUserBillingAccountInput!): BillingAccount!
  releaseBillingHold(id: ID!, reason: String!): BillingHold!
  saveBillingPriceRule(input: SaveBillingPriceRuleForm!): BillingPriceRule!
  deleteBillingPriceRule(id: ID!): Boolean!
}

extend type Query {
  projectBillingAccount(projectId: ID!): BillingAccount!
  myBillingAccount: BillingAccount!
  userBillingAccount(userId: ID!): BillingAccount!
  myPaymentOrders(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: PaymentOrderOrder): PaymentOrderConnection!
  userPaymentOrders(userId: ID!, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: PaymentOrderOrder): PaymentOrderConnection!
  myUsageBillingRecords(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: UsageBillingRecordOrder): UsageBillingRecordConnection!
  userUsageBillingRecords(userId: ID!, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: UsageBillingRecordOrder): UsageBillingRecordConnection!
  myLedgerTransactions(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: LedgerTransactionOrder): LedgerTransactionConnection!
  userLedgerTransactions(userId: ID!, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: LedgerTransactionOrder): LedgerTransactionConnection!
  adminLedgerTransactions(filter: AdminLedgerTransactionsFilter, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: LedgerTransactionOrder): LedgerTransactionConnection!
  adminUsageBillingRecords(filter: AdminUsageBillingRecordsFilter, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: UsageBillingRecordOrder): UsageBillingRecordConnection!
  adminBillingHolds(filter: AdminBillingHoldsFilter, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: BillingHoldOrder): BillingHoldConnection!
  adminPaymentOrders(filter: AdminPaymentOrdersFilter, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: PaymentOrderOrder): PaymentOrderConnection!
  adminPaymentEvents(filter: AdminPaymentEventsFilter, after: Cursor, first: Int, before: Cursor, last: Int, orderBy: PaymentEventOrder): PaymentEventConnection!
  adminBillingReport(filter: AdminBillingReportFilter): BillingCommercialReport!
  exportAdminBillingCSV(input: ExportAdminBillingCSVInput!): BillingCSVExportPayload!
}
